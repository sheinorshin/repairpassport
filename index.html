<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E4F5C">
<meta name="description" content="RepairPassport: a repair card with intake photos, condition check, agreed price and approvals for small phone repair shops.">
<title>RepairPassport</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E4F5C'/%3E%3Crect x='18' y='10' width='28' height='44' rx='5' fill='none' stroke='white' stroke-width='4'/%3E%3Cpath d='M25 33l5 5 10-11' fill='none' stroke='%23F2B33D' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hurricane&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15232A; --ink2:#4A5A61; --muted:#7A888E; --line:#DDE3E4; --bg:#F3F5F4; --card:#FFFFFF;
  --brand:#0E4F5C; --brand2:#127082; --brandSoft:#E3EFF1;
  --ok:#23784A; --okSoft:#E3F2E8; --bad:#B3261E; --badSoft:#FBE7E5; --nt:#8A9599; --ntSoft:#EEF1F2;
  --warn:#B4610E; --warnSoft:#FDF0DF; --gold:#F2B33D;
  --r:14px; --shadow:0 1px 2px rgba(16,40,48,.06),0 4px 14px rgba(16,40,48,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--brand2)}
.wrap{max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:18px;margin:0;flex:1;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{display:block;font-size:12px;font-weight:500;opacity:.8}
.hbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 11px;font-size:14px;font-weight:600;cursor:pointer}
.hbtn:active{background:rgba(255,255,255,.26)}
.timer{font-variant-numeric:tabular-nums;background:var(--gold);color:#3A2A00;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
main{flex:1;padding:14px 14px 28px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 10px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:10px 0 4px}
label.f small{font-weight:400;color:var(--muted)}
input.in,textarea.in,select.in{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;outline:none;font-size:16px}
input.in:focus,textarea.in:focus,select.in:focus{border-color:var(--brand2)}
input.in::placeholder{text-transform:none}
textarea.in{min-height:64px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:14px;cursor:pointer;user-select:none}
.chip.on{background:var(--brandSoft);border-color:var(--brand2);color:var(--brand);font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff;text-decoration:none}
.btn:active{filter:brightness(.92)}
.btn.sec{background:var(--brandSoft);color:var(--brand)}
.btn.wa{background:#1F9D55}
.btn.warn{background:var(--warn)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid #F0C9C5}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:10px;width:auto}
.btn[disabled]{opacity:.5;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stack>*+*{margin-top:8px}
.sticky-save{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(243,245,244,0))}
/* list */
.newbig{font-size:18px;padding:18px;border-radius:16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(14,79,92,.25)}
.item{display:flex;gap:12px;align-items:center;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:12px;margin-bottom:10px;cursor:pointer;text-decoration:none;color:inherit}
.thumb{width:52px;height:52px;border-radius:10px;background:var(--brandSoft) center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;color:var(--brand);font-weight:800;font-size:12px}
.item .t{font-weight:700}
.item .m{font-size:13px;color:var(--muted)}
.badge{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.b-st{background:var(--brandSoft);color:var(--brand)}
.b-pend{background:var(--warnSoft);color:var(--warn)}
.b-ok{background:var(--okSoft);color:var(--ok)}
.b-bad{background:var(--badSoft);color:var(--bad)}
.b-demo{background:#EDE7F6;color:#5E35B1}
.stats{display:flex;gap:8px;margin:0 0 12px}
.stats div{flex:1;background:#fff;border-radius:12px;padding:10px;box-shadow:var(--shadow);text-align:center}
.stats b{display:block;font-size:20px}
.stats span{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 18px}
/* photos */
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:88px;height:88px;border-radius:12px;overflow:hidden;background:#000}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.phadd{width:88px;height:88px;border-radius:12px;border:2px dashed var(--brand2);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--brand);font-size:12px;font-weight:700;cursor:pointer;text-align:center;padding:6px;background:var(--brandSoft)}
.phadd span{font-size:26px;line-height:1}
/* checks */
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ck{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:8px 9px;background:#fff;cursor:pointer;user-select:none;font-size:14px;text-align:left}
.ck i{flex:none;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:14px;background:var(--ntSoft);color:var(--nt)}
.ck.ok{border-color:#A9D3B8;background:var(--okSoft)} .ck.ok i{background:var(--ok);color:#fff}
.ck.bad{border-color:#EDB6B1;background:var(--badSoft)} .ck.bad i{background:var(--bad);color:#fff}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin:8px 0 0;flex-wrap:wrap}
.legend b{display:inline-block;width:16px;height:16px;border-radius:5px;vertical-align:-3px;margin-right:4px}
/* detail */
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.sts{display:flex;flex-wrap:wrap;gap:6px}
.sts .chip{font-size:13px}
.pitem{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.pitem.pending{border-color:#F0CE9E;background:#FFFBF4}
.pitem .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pitem .desc{font-weight:700}
.pitem .pr{font-weight:800;white-space:nowrap}
.codebox{font-size:13px;color:var(--ink2);margin:6px 0;background:var(--ntSoft);border-radius:8px;padding:6px 8px}
.codebox b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;color:var(--ink)}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:17px;border-top:1.5px solid var(--line);margin-top:10px;padding-top:10px}
.loglist{font-size:13px;color:var(--ink2);margin:0;padding-left:18px}
.loglist li{margin:2px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.sep{height:1px;background:var(--line);margin:12px 0}
/* customer */
.chead{background:linear-gradient(160deg,#0E4F5C,#127082);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 22px}
.chead .shop{font-size:14px;opacity:.85;font-weight:600}
.chead .ttl{font-size:26px;font-weight:800;margin:2px 0}
.chead .meta{font-size:15px;opacity:.9}
.langs{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}
.langs button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:4px 9px;font-size:13px;font-weight:700;cursor:pointer}
.langs button.on{background:#fff;color:var(--brand)}
.big{font-size:18px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:7px 0;color:var(--muted)}
.steps li .dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:#fff}
.steps li.done{color:var(--ink)} .steps li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.now{color:var(--ink);font-weight:800} .steps li.now .dot{background:var(--gold);border-color:var(--gold);color:#3A2A00}
.steps .when{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.approve{border:2px solid var(--gold);background:#FFFBF1}
.approve .what{font-size:19px;font-weight:800;margin:4px 0}
.approve .money{font-size:24px;font-weight:900}
.clist{list-style:none;margin:0;padding:0;font-size:16px}
.clist li{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid #EEF1F1}
.clist li:last-child{border-bottom:0}
.clist i{flex:none;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:14px}
.i-ok{background:var(--ok);color:#fff} .i-bad{background:var(--bad);color:#fff} .i-nt{background:var(--ntSoft);color:var(--nt)}
.note{font-size:14px;color:var(--ink2);background:var(--brandSoft);border-radius:12px;padding:12px}
.cphotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cphotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in;background:#000}
/* overlays */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#15232A;color:#fff;padding:11px 16px;border-radius:12px;font-size:15px;font-weight:600;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.sheet{position:fixed;inset:0;background:rgba(10,20,24,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet .panel{background:#fff;width:100%;max-width:540px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.viewer img{max-width:96vw;max-height:90vh;border-radius:8px}
/* signature (owner's standing footer) */
footer.sig{text-align:center;padding:22px 16px calc(26px + env(safe-area-inset-bottom));color:var(--muted);font-size:12px;line-height:1.5}
footer.sig .made{letter-spacing:.3px}
footer.sig .hand{display:block;font-family:"Hurricane",cursive;font-size:38px;line-height:1.1;color:var(--ink);margin:2px 0}
footer.sig a{color:var(--muted)}
/* print */
#print{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  .wrap,.toast,.sheet,.viewer{display:none!important}
  #print{display:block;color:#000;font:13pt/1.35 Arial,Helvetica,sans-serif}
  #print h1{font-size:24pt;margin:0}
  #print .ph{width:auto;height:auto;background:none;border-radius:0}
  #print table{width:100%;border-collapse:collapse;margin:6pt 0}
  #print td{border:1px solid #888;padding:3pt 5pt;vertical-align:top}
  #print .two{display:flex;gap:14pt;align-items:flex-start}
  #print .pphotos img{width:36mm;height:36mm;object-fit:cover;border:1px solid #888;margin-right:3mm}
  #print .sign{display:flex;gap:20mm;margin-top:16pt}
  #print .sign div{flex:1;border-top:1px solid #000;padding-top:3pt;font-size:12pt}
  #print .qr svg{width:44mm;height:44mm}
}
</style>
</head>

/* ===================== SHA-256 (approval codes) ===================== */
const K256=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function sha256(str){
  const bytes=new TextEncoder().encode(str),l=bytes.length,padLen=((l+9+63)>>6)<<6;
  const m=new Uint8Array(padLen);m.set(bytes);m[l]=0x80;const dv=new DataView(m.buffer);
  dv.setUint32(padLen-4,(l*8)>>>0);dv.setUint32(padLen-8,Math.floor(l/0x20000000));
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const w=new Uint32Array(64);
  for(let i=0;i<padLen;i+=64){
    for(let j=0;j<16;j++)w[j]=dv.getUint32(i+j*4);
    for(let j=16;j<64;j++){const x=w[j-15],y=w[j-2];const s0=((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3);const s1=((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10);w[j]=(w[j-16]+s0+w[j-7]+s1)>>>0}
    let [a,b,c,d,e,f,g,h]=H;
    for(let j=0;j<64;j++){const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));const ch=(e&f)^(~e&g);const t1=(h+S1+ch+K256[j]+w[j])>>>0;const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));const mj=(a&b)^(a&c)^(b&c);const t2=(S0+mj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
    H=[H[0]+a,H[1]+b,H[2]+c,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(x=>x>>>0);
  }
  return H.map(x=>x.toString(16).padStart(8,"0")).join("");
}
const B32="23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
function approvalCode(cardId,item,decision){
  const hex=sha256([cardId,item.id,item.desc,Math.round(item.price),decision].join("|"));
  let n=parseInt(hex.slice(0,8),16)>>>2,out="";for(let i=0;i<6;i++){out=B32[n&31]+out;n=Math.floor(n/32)}return out;
}

/* ===================== link encoding ===================== */
function b64u(bytes){let s="";for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function unb64u(str){str=str.replace(/-/g,"+").replace(/_/g,"/");while(str.length%4)str+="=";const bin=atob(str);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function streamBytes(bytes,ctor){const s=new Blob([bytes]).stream().pipeThrough(ctor);return new Uint8Array(await new Response(s).arrayBuffer())}
async function encodePayload(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream!=="undefined"){try{return "z"+b64u(await streamBytes(raw,new CompressionStream("deflate-raw")))}catch(e){}}
  return "j"+b64u(raw);
}
async function decodePayload(s){
  const kind=s[0],bytes=unb64u(s.slice(1));
  const out=kind==="z"?await streamBytes(bytes,new DecompressionStream("deflate-raw")):bytes;
  return JSON.parse(new TextDecoder().decode(out));
}
function baseUrl(){return location.href.split("#")[0]}
function payloadOf(card,withPhotos){
  return {v:1,l:LANG,n:S.shopName,w:digits(S.shopPhone),i:card.id,t:card.createdAt,m:card.model,f:card.fault,
    k:CHECKS.map(k=>({ok:"1",bad:"0"}[card.checks[k]]||"-")).join(""),d:card.damage,dn:card.damageNote||"",
    p:card.prelim||0,pn:card.prelimNote?1:0,df:card.diagFee||0,
    it:card.items.map(x=>[x.id,x.kind==="extra"?1:0,x.desc,Math.round(x.price),x.state==="approved"?1:x.state==="declined"?2:0,x.dAt||""]),
    s:card.status,sl:card.statusLog.map(x=>[x.s,x.at]),u:new Date().toISOString(),ph:withPhotos?card.photos:[]};
}
const LINKS={};
async function buildLinks(card){
  const key=card.id+":"+card.rev;
  if(LINKS[key])return LINKS[key];
  const full=baseUrl()+"#c="+await encodePayload(payloadOf(card,true));
  const short=baseUrl()+"#c="+await encodePayload(payloadOf(card,false));
  return LINKS[key]={full,short};
}

function toBlob(cv,type,q){return new Promise(res=>cv.toBlob(res,type,q))}
async function loadBitmap(file){
  if(window.createImageBitmap){try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){try{return await createImageBitmap(file)}catch(e2){}}}
  return await new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=URL.createObjectURL(file)});
}
async function processPhoto(file){
  const bmp=await loadBitmap(file);const W=bmp.width,H=bmp.height;const type=canWebp()?"image/webp":"image/jpeg";
  const cv=document.createElement("canvas");const ctx=cv.getContext("2d");let last=null;
  for(const side of [520,440,360,300]){
    const k=Math.min(1,side/Math.max(W,H));cv.width=Math.max(1,Math.round(W*k));cv.height=Math.max(1,Math.round(H*k));
    ctx.fillStyle="#000";ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(bmp,0,0,cv.width,cv.height);
    for(const q of [0.62,0.5,0.4,0.32]){const b=await toBlob(cv,type,q);if(!b)continue;last=b;if(b.size<=12500)return blobToDataURL(b)}
  }
  return blobToDataURL(last);
}

/* ===================== router ===================== */
let VIEW={};
function go(h){if(location.hash===h)route();else location.hash=h}
window.addEventListener("hashchange",route);
async function route(){
  const h=location.hash||"";
  closeSheets();
  if(h.startsWith("#c=")){return renderCustomer(h.slice(3))}
  if(!S||!S.shopName){return renderSetup()}
  if(h==="#/new")return renderNew();
  if(h.startsWith("#/card/"))return renderCard(decodeURIComponent(h.slice(7)));
  if(h==="#/settings")return renderSettings();
  return renderList();
}
function closeSheets(){$$(".sheet,.viewer").forEach(x=>x.remove());clearInterval(VIEW.timer)}
function shell(title,sub,left,right,body,extra){
  $("#app").onclick=null;$("#app").innerHTML=`<header class="top">${left||""}<h1>${esc(title)}${sub?`<span class="sub">${esc(sub)}</span>`:""}</h1>${right||""}</header><main>${body}</main>${extra||""}${signature()}`;
  document.documentElement.lang=LANG==="kk"?"kk":LANG;
  window.scrollTo(0,0);
}

function logLabel(l){
  if(l.e==="created")return t("saved")+" ("+l.v+")";
  if(l.e==="status")return t("status")+": "+tt("st",l.v);
  if(l.e==="request")return t("askApprove")+": "+l.v;
  if(l.e==="decision")return l.v;
  if(l.e==="sent")return t("send")+": "+l.v;
  return l.e+" "+l.v;
}
function decide(c,itemId,how){
  const x=c.items.find(i=>i.id===itemId);if(!x||x.state!=="pending")return;
  if(how==="ok"){
    const inp=$(`[data-code="${itemId}"]`);const code=(inp&&inp.value||"").trim().toUpperCase().replace(/\s/g,"");
    if(code){
      if(code===approvalCode(c.id,x,"A")){x.state="approved";x.via="code";toast(t("codeOk"))}
      else if(code===approvalCode(c.id,x,"D")){x.state="declined";x.via="code"}
      else{toast(t("codeBad"));inp.focus();return}
    }else{x.state="approved";x.via="manual"}
  }else if(how==="person"){x.state="approved";x.via="person"}
  else{x.state="declined";x.via="manual"}
  x.dAt=new Date().toISOString();
  addLog(c,"decision",`${x.desc}: ${x.state==="approved"?t("approved"):t("declined")} (${x.via==="code"?t("viaCode"):x.via==="person"?t("viaPerson"):t("viaManual")})`);
  bump(c);logEv("item_decision",c.id,`${x.state};${x.via}`);renderCard(c.id);
}
function sendAction(c,kind){
  const key=c.id+":"+c.rev;const L=LINKS[key];
  if(!L){toast(t("linkBuilding"));buildLinks(c).catch(()=>{});return}
  const pending=c.items.filter(x=>x.state==="pending").slice(-1)[0];
  let msg;
  if(kind==="status")msg=t("msgStatus",{shop:S.shopName,id:c.id,model:c.model,status:tt("st",c.status),link:L.full});
  else if(pending&&kind!=="short")msg=t("msgApprove",{shop:S.shopName,id:c.id,desc:pending.desc,price:money(pending.price),link:L.full});
  else msg=t("msgCard",{shop:S.shopName,id:c.id,model:c.model,link:kind==="short"?L.short:L.full});
  const note=(v)=>{c.sent.push({at:new Date().toISOString(),kind:v});addLog(c,"sent",v);saveCards();logEv("link_"+v,c.id,v==="short"?L.short.length:L.full.length)};
  if(kind==="wa"||kind==="status"){
    const ph=digits(c.customer.phone);
    window.open((ph?`https://wa.me/${ph}`:"https://wa.me/")+"?text="+encodeURIComponent(msg),"_blank");note(kind==="status"?"status":"whatsapp");return;
  }
  if(kind==="share"){if(navigator.share){navigator.share({text:msg}).then(()=>note("share")).catch(()=>{})}else{copyText(msg);note("copy")}return}
  if(kind==="copy"){copyText(L.full);note("copy");return}
  if(kind==="short"){if(navigator.share){navigator.share({text:msg}).then(()=>note("short")).catch(()=>{})}else{copyText(L.short);note("short")}return}
  if(kind==="preview"){window.open(L.full,"_blank");return}
  if(kind==="print"){printCard(c,L.short);note("print")}
}
function copyText(s){
  const done=()=>toast(t("copied"));
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(done,()=>fallback())}else fallback();
  function fallback(){const ta=document.createElement("textarea");ta.value=s;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}ta.remove()}
}
function zoom(src){const v=document.createElement("div");v.className="viewer";v.innerHTML=`<img src="${safeImg(src)}" alt="">`;v.onclick=()=>v.remove();document.body.appendChild(v)}
function qrSvg(text){try{const q=qrcode(0,"L");q.addData(text,"Byte");q.make();return q.createSvgTag({cellSize:3,margin:2,scalable:true})}catch(e){return ""}}
function printCard(c,shortLink){
  const cell=k=>{const v=c.checks[k]||"nt";return `<td>${esc(tt("ck",k))}</td><td><b>${v==="ok"?"✓ "+t("works"):v==="bad"?"✕ "+t("notWorking"):"– "+t("notTested")}</b></td>`};
  let ck="";for(let i=0;i<CHECKS.length;i+=2)ck+=`<tr>${cell(CHECKS[i])}${CHECKS[i+1]?cell(CHECKS[i+1]):"<td></td><td></td>"}</tr>`;
  const items=c.items.filter(x=>x.state!=="pending").map(x=>`<tr><td>${esc(x.desc)}</td><td>${money(x.price)}</td><td>${esc(x.state==="approved"?t("approved"):t("declined"))}</td></tr>`).join("");
  $("#print").innerHTML=`
   <div class="two"><div style="flex:1"><div style="font-size:12pt">${esc(S.shopName)}${S.shopPhone?" · "+esc(S.shopPhone):""}</div><h1>${t("cTitle")} ${esc(c.id)}</h1>
   <div>${esc(fdate(c.createdAt))}</div></div><div class="qr" style="text-align:center">${qrSvg(shortLink)}<div style="font-size:10pt;max-width:48mm">${t("pScan")}</div></div></div>
   <table><tr><td style="width:35%">${t("cDevice")}</td><td><b>${esc(c.model)}</b></td></tr><tr><td>${t("cProblem")}</td><td>${esc(c.fault||"–")}</td></tr>
   ${c.customer.name||c.customer.phone?`<tr><td>${t("customer")}</td><td>${esc([c.customer.name,c.customer.phone].filter(Boolean).join(" · "))}</td></tr>`:""}
   <tr><td>${t("cPrelim")}</td><td><b>${money(c.prelim)}</b>${c.prelimNote?" — "+esc(t("prelimNote").toLowerCase()):""}</td></tr>
   ${c.diagFee?`<tr><td>${esc(noCur(t("diagFee")))}</td><td>${money(c.diagFee)}</td></tr>`:""}
   <tr><td>${t("cDamage")}</td><td>${esc(c.damage.map(d=>tt("dm",d)).concat(c.damageNote?[c.damageNote]:[]).join(", ")||t("cNoDamage"))}</td></tr></table>
   <div style="font-weight:bold;margin-top:8pt">${t("cCondition")}</div><table>${ck}</table>
   ${items?`<div style="font-weight:bold;margin-top:8pt">${t("cAgreed")}</div><table>${items}</table>`:""}
   ${c.photos.length?`<div class="pphotos" style="margin-top:8pt">${c.photos.map(p=>`<img src="${safeImg(p)}" alt="">`).join("")}</div>`:""}
   <p style="margin-top:10pt">${t("pAgree")}</p>
   <div class="sign"><div>${t("pSignC")}</div><div>${t("pSignT")}</div></div>
   <p style="font-size:10pt;color:#555;margin-top:12pt">RepairPassport · ${t("cKeep")}</p>`;
  setTimeout(()=>window.print(),60);
}

function csv(rows){return rows.map(r=>r.map(v=>{v=v==null?"":String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")).join("\n")}
function complete(c){const marked=CHECKS.some(k=>c.checks[k]&&c.checks[k]!=="nt")||c.damage.length>0||c.checks.power==="bad";return c.photos.length>0&&marked&&c.prelim>0&&c.sent.length>0}
function exportCsv(){
  const lt=iso=>{const d=new Date(iso);return isNaN(d)?"":d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0")};
  const ev=[["time_utc","local_time","session","event","card","value","seconds"]].concat(EVENTS.map(e=>[e.t,lt(e.t),e.sess,e.ev,e.card,e.v,e.s]));
  const cards=[["card","session","created_local","create_seconds","photos","checks_marked","damage_marked","preliminary_price","sent_or_printed","complete_card","help_needed","approvals_requested","approvals_recorded","approvals_by_code","status","demo"]]
   .concat(CARDS.map(c=>[c.id,c.sess,lt(c.createdAt),c.createSec,c.photos.length,CHECKS.filter(k=>c.checks[k]&&c.checks[k]!=="nt").length,c.damage.length,c.prelim,c.sent.length?"yes":"no",complete(c)?"yes":"no",c.help||"",c.items.length,c.items.filter(x=>x.state!=="pending").length,c.items.filter(x=>x.via==="code").length,c.status,c.demo?"yes":"no"]));
  const stamp=lt(new Date().toISOString()).slice(0,16).replace(/[: ]/g,"-");const tag=(S.sess||"shop").replace(/[^A-Za-z0-9]/g,"");
  const files=[new File(["﻿"+csv(cards)],`repairpassport_cards_${tag}_${stamp}.csv`,{type:"text/csv"}),new File(["﻿"+csv(ev)],`repairpassport_events_${tag}_${stamp}.csv`,{type:"text/csv"})];
  logEv("export","",CARDS.length);
  if(navigator.canShare&&navigator.canShare({files})){navigator.share({files,title:"RepairPassport test data"}).catch(()=>download(files));}else download(files);
}
function download(files){files.forEach((f,i)=>setTimeout(()=>{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)},i*400))}
async function demoPhoto(variant){
  const cv=document.createElement("canvas");cv.width=900;cv.height=900;const g=cv.getContext("2d");
  const bg=g.createLinearGradient(0,0,900,900);bg.addColorStop(0,"#C9B79C");bg.addColorStop(1,"#A68F6F");g.fillStyle=bg;g.fillRect(0,0,900,900);
  for(let i=0;i<40;i++){g.strokeStyle="rgba(90,60,30,.08)";g.lineWidth=3;g.beginPath();g.moveTo(0,i*24);g.bezierCurveTo(300,i*24+12,600,i*24-10,900,i*24+6);g.stroke()}
  g.save();g.translate(450,450);g.rotate(variant?0.12:-0.08);
  g.fillStyle="rgba(0,0,0,.28)";rr(g,-205,-385,420,790,58);g.fill();
  g.fillStyle=variant?"#2B2F33":"#1C1F22";rr(g,-215,-400,420,790,58);g.fill();
  if(!variant){g.fillStyle="#0B0D10";rr(g,-195,-375,380,740,44);g.fill();
    const sc=g.createLinearGradient(-195,-375,185,365);sc.addColorStop(0,"#26323C");sc.addColorStop(1,"#0E1419");g.fillStyle=sc;rr(g,-188,-366,366,722,40);g.fill();
    g.strokeStyle="rgba(235,245,255,.85)";g.lineWidth=3;[[[40,-120],[-60,-40],[-150,-90]],[[40,-120],[110,-10],[150,140]],[[40,-120],[-10,60],[-120,220]],[[40,-120],[140,-200]],[[-60,-40],[-170,30]],[[110,-10],[170,-60]]].forEach(p=>{g.beginPath();g.moveTo(p[0][0],p[0][1]);p.slice(1).forEach(q=>g.lineTo(q[0],q[1]));g.stroke()});
    g.fillStyle="#000";rr(g,-55,-355,110,30,15);g.fill();
  }else{g.fillStyle="#3A3F44";rr(g,-150,-330,170,170,40);g.fill();[[-110,-290],[-40,-290],[-75,-215]].forEach(p=>{g.fillStyle="#0F1215";g.beginPath();g.arc(p[0],p[1],32,0,7);g.fill();g.fillStyle="#2C4A60";g.beginPath();g.arc(p[0],p[1],16,0,7);g.fill()});
    g.strokeStyle="rgba(230,230,230,.55)";g.lineWidth=2;for(let i=0;i<7;i++){g.beginPath();g.moveTo(-120+i*35,40+i*9);g.lineTo(-40+i*35,110+i*9);g.stroke()}}
  g.restore();
  g.fillStyle="rgba(255,255,255,.85)";g.font="bold 34px system-ui,sans-serif";g.fillText("DEMO PHOTO",30,870);
  const b=await toBlob(cv,"image/jpeg",0.9);return processPhoto(new File([b],"demo.jpg",{type:"image/jpeg"}));
  function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
}

/* ===================== customer view ===================== */
async function renderCustomer(payload){
  let d;
  try{d=await decodePayload(payload);if(!d||d.v!==1||!d.i)throw 0}catch(e){
    $("#app").innerHTML=`<div class="chead"><div class="ttl">RepairPassport</div></div><main><div class="card"><p class="big">${esc(T[LANG].cBroken)}</p></div></main>${signature()}`;return}
  let L=(VIEW.cLang)||(T[d.l]?d.l:"ru");
  const tl=(k,v)=>{let s=T[L][k]??T.ru[k];if(v)for(const x in v)s=s.split("{"+x+"}").join(v[x]);return s};
  const items=(Array.isArray(d.it)?d.it:[]).map(a=>({id:String(a[0]),kind:a[1]?"extra":"repair",desc:String(a[2]||""),price:Number(a[3])||0,state:a[4]===1?"approved":a[4]===2?"declined":"pending",dAt:a[5]||""}));
  const agreed=items.filter(x=>x.state==="approved").reduce((s,x)=>s+x.price,0);
  const pend=items.filter(x=>x.state==="pending");
  const sl=Array.isArray(d.sl)?d.sl:[];const idx=Math.max(0,STATUSES.indexOf(d.s));
  const whenOf=s=>{const r=sl.filter(x=>x[0]===s).slice(-1)[0];return r?fdate(r[1],L):""};
  const steps=STATUSES.map((s,i)=>`<li class="${i<idx?"done":i===idx?"now":""}"><span class="dot">${i<idx?"✓":i+1}</span><span>${esc(tt("st",s,L))}<span class="when">${i<=idx?esc(whenOf(s)):""}</span></span></li>`).join("");
  const kstr=String(d.k||"");
  const ck=CHECKS.map((k,i)=>{const v=kstr[i]==="1"?"ok":kstr[i]==="0"?"bad":"nt";return `<li><i class="${v==="ok"?"i-ok":v==="bad"?"i-bad":"i-nt"}">${v==="ok"?"✓":v==="bad"?"✕":"–"}</i><span>${esc(tt("ck",k,L))} — <span class="muted">${esc(v==="ok"?tl("works"):v==="bad"?tl("notWorking"):tl("notTested"))}</span></span></li>`}).join("");
  const dmg=(Array.isArray(d.d)?d.d:[]).filter(x=>DAMAGE.includes(x)).map(x=>tt("dm",x,L)).concat(d.dn?[String(d.dn)]:[]);
  const photos=(Array.isArray(d.ph)?d.ph:[]).map(safeImg).filter(Boolean);
  const apprBlocks=pend.map(x=>`<div class="card approve"><h2 style="color:var(--warn)">${tl("cApproveTitle")}</h2><div>${tl("cApproveText")}</div>
     <div class="what">${esc(x.desc)}</div><div class="money">${money(x.price,L)}</div>
     <p class="small muted" style="margin:4px 0 12px">${esc(tl("cNewTotal",{sum:money(agreed+x.price,L)}))}</p>
     <div class="grid2"><button class="btn wa" data-dec="A" data-id="${esc(x.id)}">✓ ${tl("cAgree")}</button><button class="btn danger" data-dec="D" data-id="${esc(x.id)}">✕ ${tl("cDisagree")}</button></div>
     <p class="small" id="r-${esc(x.id)}" style="margin:10px 0 0"></p></div>`).join("");
  $("#app").innerHTML=`
   <div class="chead"><div class="langs">${["ru","kk","en"].map(l=>`<button class="${l===L?"on":""}" data-lang="${l}">${l==="kk"?"ҚАЗ":l.toUpperCase()}</button>`).join("")}</div>
     <div class="shop">${esc(tl("cFrom",{shop:d.n||""}))}</div><div class="ttl">${tl("cTitle")} ${esc(d.i)}</div>
     <div class="meta">${esc(d.m||"")} · ${esc(tl("cReceived",{date:fdate(d.t,L)}))}</div></div>
   <main>
   ${apprBlocks}
   <div class="card"><h2>${esc(tl("status"))}</h2><ul class="steps">${steps}</ul></div>
   <div class="card"><h2>${esc(tl("price"))}</h2>
     <div class="row"><span class="muted">${tl("cPrelim")}</span><b style="flex:none">${money(d.p,L)}</b></div>
     ${d.pn?`<p class="small muted" style="margin:2px 0 0">${esc(tl("prelimNote"))}</p>`:""}
     ${Number(d.df)>0?`<div class="row small" style="margin-top:6px"><span class="muted">${esc(noCur(tl("diagFee")))}</span><b style="flex:none">${money(d.df,L)}</b></div>`:""}
     ${items.filter(x=>x.state!=="pending").map(x=>`<div class="row" style="margin-top:8px"><span>${esc(x.desc)} <span class="badge ${x.state==="approved"?"b-ok":"b-bad"}">${esc(x.state==="approved"?tl("approved"):tl("declined"))}</span></span><b style="flex:none">${money(x.price,L)}</b></div>`).join("")}
     ${items.some(x=>x.state==="approved")?`<div class="total"><span>${tl("cAgreed")}</span><span>${money(agreed,L)}</span></div>`:""}
   </div>
   <div class="card"><h2>${tl("photos")}</h2>${photos.length?`<div class="cphotos">${photos.map(p=>`<img src="${p}" alt="" data-zoom>`).join("")}</div>`:`<p class="muted">${tl("cNoPhotosHere")}</p>`}</div>
   <div class="card"><h2>${tl("cCondition")}</h2>
     <dl class="kv" style="margin-bottom:8px"><dt>${tl("cDevice")}</dt><dd>${esc(d.m||"–")}</dd><dt>${tl("cProblem")}</dt><dd>${esc(d.f||"–")}</dd></dl>
     <ul class="clist">${ck}</ul>
     <p style="margin:10px 0 0"><b>${tl("cDamage")}:</b> ${esc(dmg.join(", ")||tl("cNoDamage"))}</p></div>
   <p class="note">🔒 ${tl("cKeep")}<br><span class="small muted">${esc(tl("cAsOf",{date:fdate(d.u,L)}))}</span></p>
   </main>${signature()}`;
  document.documentElement.lang=L;window.scrollTo(0,0);
  $("#app").onclick=e=>{
    const lb=e.target.closest("[data-lang]");if(lb){VIEW.cLang=lb.dataset.lang;renderCustomer(payload);return}
    const z=e.target.closest("[data-zoom]");if(z){zoom(z.src);return}
    const b=e.target.closest("[data-dec]");if(!b)return;
    const x=items.find(i=>i.id===b.dataset.id);if(!x)return;const dec=b.dataset.dec;
    const code=approvalCode(d.i,x,dec);
    const text=tl(dec==="A"?"replyAgree":"replyDecline",{id:d.i,desc:x.desc,price:money(x.price,L),code});
    const r=$("#r-"+CSS.escape(x.id));if(r)r.innerHTML=`<b>${esc(tl("cYourCode",{c:code}))}</b><br>${esc(tl("cSent"))}`;
    const w=String(d.w||"").replace(/\D/g,"");
    window.open((w?`https://wa.me/${w}`:"https://wa.me/")+"?text="+encodeURIComponent(text),"_blank");
  };
}
